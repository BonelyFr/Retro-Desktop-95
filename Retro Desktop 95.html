<title>Retro Desktop 95</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one full-screen blue desktop with an icon column at the left, black-and-white windows floating above it, and a white taskbar pinned to the bottom. Deliberately a single look (no dark mode). */
:root {
  --desk: #0000aa;
  --folder: #ffd83d;
  --folder-shade: #d9a900;
  --paper: #ffffff;
  --ink: #000000;
  --alert: #e00000;
  --ui: 'Pixelify Sans', Tahoma, 'Trebuchet MS', Verdana, sans-serif;
  --mono: 'VT323', 'Courier New', monospace;
  --bar: 44px;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --barh: calc(var(--bar) + env(safe-area-inset-bottom, 0px));
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--desk); color: var(--ink);
  font: 16px/1.25 var(--ui); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px dashed currentColor; outline-offset: 2px; }

.screen { position: fixed; inset: 0; overflow: hidden; background: var(--desk); }
.desktop { position: absolute; left: 0; right: 0; top: 0; bottom: var(--barh); padding: env(safe-area-inset-top, 0px) var(--gr) 0 var(--gl); }
.icons { height: 100%; display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start; gap: 6px; padding-top: 10px; }
.wins { position: absolute; inset: env(safe-area-inset-top, 0px) var(--gr) 0 var(--gl); pointer-events: none; }

/* desktop icons */
.dicon { width: 84px; height: 90px; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 4px 2px; background: none; border: 2px dotted transparent; color: #fff; cursor: pointer; }
.dicon .ico { width: 42px; height: 42px; flex: none; }
.dicon .lbl { font-size: 15px; line-height: 1.1; text-align: center; padding: 1px 3px; max-width: 100%; overflow-wrap: anywhere; text-shadow: 1px 1px 0 #000; }
.dicon.sel { border-color: #fff; }
.dicon.sel .lbl { background: var(--ink); text-shadow: none; }

/* windows */
.win { position: absolute; pointer-events: auto; background: var(--paper); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); display: flex; flex-direction: column; max-width: 100%; }
.win.max { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; box-shadow: none; }
.tb { display: flex; align-items: center; gap: 6px; height: 34px; padding: 3px 4px 3px 6px; flex: none; background: var(--paper); color: var(--ink); border-bottom: 2px solid var(--ink); touch-action: none; }
.win.active .tb { background: var(--ink); color: var(--paper); }
.ti { width: 20px; height: 20px; flex: none; background: var(--paper); }
.ti svg, .tico svg, .mi .mico svg, .ficon svg, .dicon .ico svg { display: block; width: 100%; height: 100%; }
.tt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.tbtns { display: flex; gap: 4px; }
.wb { width: 26px; height: 26px; padding: 0; display: grid; place-items: center; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); cursor: pointer; }
.wb:active { background: var(--ink); color: var(--paper); }
.win.active .wb:active { background: var(--paper); color: var(--ink); opacity: .6; }
.wbody { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.grip { position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; touch-action: none; z-index: 5;
  background: linear-gradient(135deg, transparent 50%, var(--ink) 50% 60%, transparent 60% 72%, var(--ink) 72% 82%, transparent 82%); }
.win.max .grip, .win.fixed .grip { display: none; }

/* shared controls */
.btn { min-height: 30px; padding: 3px 10px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); cursor: pointer; white-space: nowrap; }
.btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: none; background: var(--ink); color: var(--paper); }
.btn.on, .btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.btn:disabled { opacity: .35; cursor: default; box-shadow: none; }
.btn.sm { min-height: 26px; padding: 1px 8px; }
.inp { font: inherit; min-width: 0; flex: 1 1 120px; padding: 3px 6px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); -webkit-user-select: text; user-select: text; border-radius: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; border-bottom: 2px solid var(--ink); flex: none; }
.strip { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px; border-bottom: 2px solid var(--ink); }
.strip.list { max-height: 132px; overflow: auto; }
.statusbar { flex: none; display: flex; justify-content: space-between; gap: 8px; padding: 3px 8px; border-top: 2px solid var(--ink); font-size: 14px; }
.statusbar span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* files */
.pathbar { flex: none; padding: 3px 8px; border-bottom: 2px solid var(--ink); font: 20px/1.1 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.filegrid { flex: 1; min-height: 0; overflow: auto; padding: 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); align-content: start; gap: 6px; }
.fitem { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 2px; border: 2px solid transparent; cursor: pointer; min-width: 0; }
.fitem .ficon { width: 38px; height: 38px; }
.fitem .flabel { font-size: 14px; line-height: 1.1; text-align: center; overflow-wrap: anywhere; padding: 1px 3px; max-width: 100%; }
.fitem.sel { border: 2px dotted var(--ink); }
.fitem.sel .flabel { background: var(--ink); color: var(--paper); }
.fitem .inp { flex: none; width: 100%; font-size: 14px; padding: 1px 3px; }
.empty { grid-column: 1 / -1; padding: 24px 8px; text-align: center; font-size: 15px; }

/* notepad */
.npad { flex: 1; min-height: 0; width: 100%; resize: none; border: 0; outline: 0; padding: 8px; font: 21px/1.1 var(--mono); background: var(--paper); color: var(--ink); -webkit-user-select: text; user-select: text; border-radius: 0; }
.npad.nowrap { white-space: pre; overflow: auto; }

/* calculator */
.calc { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.scr { border: 2px solid var(--ink); padding: 2px 8px 4px; text-align: right; font-family: var(--mono); min-width: 0; }
.scr .hist { font-size: 19px; height: 20px; line-height: 20px; overflow: hidden; white-space: nowrap; }
.scr .num { font-size: 42px; line-height: 1.05; height: 44px; overflow: hidden; white-space: nowrap; }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.key { height: 44px; padding: 0; min-width: 0; }
.key.op, .key.eq { background: var(--ink); color: var(--paper); }
.key.op:active:not(:disabled), .key.eq:active:not(:disabled) { background: var(--paper); color: var(--ink); }

/* paint */
.pstage { flex: 1; min-height: 0; overflow: auto; padding: 8px; background: radial-gradient(circle, #000 .8px, transparent 1px) 0 0 / 6px 6px, #fff; }
.pcanvas { display: block; width: 100%; max-width: 640px; height: auto; border: 2px solid var(--ink); background: #fff; image-rendering: pixelated; touch-action: none; cursor: crosshair; }
.pal { flex: none; display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; padding: 7px 8px; border-top: 2px solid var(--ink); }
.sw { height: 24px; padding: 0; border: 2px solid var(--ink); cursor: pointer; min-width: 0; }
.sw[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 1px; }

/* minesweeper */
.mines { padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.mhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; }
.lcd { background: #000; color: var(--alert); font: 30px/1 var(--mono); padding: 3px 7px; min-width: 62px; text-align: center; letter-spacing: .06em; border: 2px solid var(--ink); }
.face { width: 42px; height: 42px; padding: 0; font: 26px/1 var(--mono); }
.mgrid { display: grid; grid-template-columns: repeat(9, 28px); grid-auto-rows: 28px; border: 2px solid var(--ink); touch-action: manipulation; }
.cell { width: 28px; height: 28px; padding: 0; margin: 0; border: 1px solid var(--ink); border-radius: 0; display: grid; place-items: center; font: 24px/1 var(--mono); cursor: pointer;
  background: radial-gradient(circle at 1px 1px, #000 .7px, transparent 1px) 0 0 / 4px 4px, #fff; }
.cell.open { background: var(--paper); cursor: default; }
.cell.boom { background: var(--alert); }
.cell svg { width: 18px; height: 18px; display: block; }
.n1 { color: #0000ff; } .n2 { color: #007a00; } .n3 { color: #e00000; } .n4 { color: #000080; }
.n5 { color: #800000; } .n6 { color: #008080; } .n7 { color: #000; } .n8 { color: #666; }
.mfoot { display: flex; align-items: center; gap: 10px; width: 100%; font-size: 14px; }
.mfoot span { flex: 1; min-width: 0; }

/* tanks */
.tstage { flex: 1; min-height: 0; display: grid; place-items: center; padding: 6px; background: var(--paper); overflow: hidden; }
.tcanvas { display: block; background: #fff; touch-action: none; cursor: crosshair; }
.tpad { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px; border-top: 2px solid var(--ink); }
.tpad .dp { display: flex; gap: 6px; }
.tpad .btn { min-width: 46px; min-height: 44px; padding: 0 10px; touch-action: none; }
.thint { flex: none; padding: 3px 8px; border-top: 2px solid var(--ink); font-size: 13px; line-height: 1.25; }

/* taskbar */
.taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: var(--barh); z-index: 900; display: flex; align-items: center; gap: 8px; background: var(--paper); border-top: 3px solid var(--ink); padding: 0 var(--gr) env(safe-area-inset-bottom, 0px) var(--gl); }
.start { display: flex; align-items: center; gap: 8px; font-weight: 600; min-height: 32px; flex: none; }
.start .logo { width: 16px; height: 16px; display: block; }
.start[aria-expanded="true"] { background: var(--ink); color: var(--paper); }
.start[aria-expanded="true"] .logo rect { fill: var(--paper); }
.tasks { flex: 1; min-width: 0; display: flex; gap: 6px; overflow: hidden; }
.task { flex: 1 1 0; min-width: 34px; max-width: 160px; height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 6px; background: var(--paper); border: 2px solid var(--ink); cursor: pointer; text-align: left; }
.task .tico { width: 18px; height: 18px; flex: none; }
.task .tlab { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.task.on { background: var(--ink); color: var(--paper); }
.task.min { border-style: dashed; }
.tray { flex: none; }
.clock { min-width: 84px; font-variant-numeric: tabular-nums; box-shadow: none; }

/* start menu and calendar */
.menu { position: absolute; left: var(--gl); bottom: calc(var(--barh) + 2px); z-index: 950; display: flex; background: var(--paper); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); min-width: 220px; max-width: calc(100% - 32px); }
.brand { width: 34px; flex: none; background: var(--ink); color: var(--paper); display: flex; align-items: flex-end; justify-content: center; padding: 8px 0; }
.brand span { writing-mode: vertical-rl; transform: rotate(180deg); font-weight: 600; font-size: 20px; letter-spacing: .14em; white-space: nowrap; }
.menu ul { list-style: none; margin: 0; padding: 4px; flex: 1; min-width: 0; }
.mi { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 10px; background: none; border: 0; text-align: left; cursor: pointer; }
.mi .mico { width: 26px; height: 26px; flex: none; }
.mi:hover, .mi:focus-visible { background: var(--ink); color: var(--paper); outline: none; }
.sep { height: 2px; background: var(--ink); margin: 4px 2px; }
.cal { position: absolute; right: var(--gr); bottom: calc(var(--barh) + 2px); z-index: 950; width: 264px; max-width: calc(100% - 32px); background: var(--paper); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 8px; }
.calhead { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px; font-weight: 600; }
.calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.calgrid span { padding: 5px 0; font-variant-numeric: tabular-nums; }
.calgrid .dow { font-size: 13px; border-bottom: 2px solid var(--ink); }
.calgrid .today { background: var(--ink); color: var(--paper); }
.calfoot { margin-top: 8px; padding-top: 6px; border-top: 2px solid var(--ink); font-size: 14px; text-align: center; }

/* dialogs, shutdown, boot */
.veil { position: absolute; inset: 0; z-index: 2000; display: grid; place-items: center; padding: 16px; background: rgba(0, 0, 0, .4); }
.dlg { width: min(340px, 100%); background: var(--paper); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); }
.dtb { background: var(--ink); color: var(--paper); padding: 6px 10px; font-weight: 600; }
.dmsg { padding: 16px 12px; }
.dbtns { display: flex; justify-content: flex-end; gap: 8px; padding: 0 12px 12px; }
.off, .boot { position: absolute; inset: 0; z-index: 3000; background: #000; display: grid; place-items: center; text-align: center; padding: 24px; font-family: var(--mono); }
.off { color: #ff9f1a; font-size: 30px; line-height: 1.15; cursor: pointer; }
.off .hint { margin-top: 18px; font-size: 20px; opacity: .8; }
.boot { color: #fff; font-size: 26px; }
.boot b { display: block; font: 600 34px/1 var(--ui); letter-spacing: .12em; margin-bottom: 18px; }
.bar { display: flex; gap: 4px; justify-content: center; margin-top: 16px; }
.bar i { width: 18px; height: 16px; border: 2px solid #fff; }
.bar i.f { background: #fff; }

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="screen" id="screen">
  <div class="desktop" id="desktop">
    <div class="icons" id="icons"></div>
    <div class="wins" id="wins"></div>
  </div>
  <div class="menu" id="menu" hidden></div>
  <div class="cal" id="cal" hidden></div>

</div>

/* ---------- app: Calculator ---------- */
function mountCalc(win) {
  let cur = '0', acc = null, op = null, fresh = true, lastOp = null, lastVal = null, err = false, hist = '';
  const SYM = { '+': '+', '-': '\u2212', '*': '\u00d7', '/': '\u00f7' };
  const num = h('div', { class: 'num' }), histEl = h('div', { class: 'hist' });
  const fmtN = (x) => String(parseFloat(x.toPrecision(12)));
  function show() {
    num.textContent = cur; histEl.textContent = hist;
    num.style.fontSize = err ? '22px' : cur.length > 13 ? '26px' : cur.length > 10 ? '32px' : '42px';
  }
  function clearAll() { cur = '0'; acc = null; op = null; fresh = true; lastOp = null; lastVal = null; err = false; hist = ''; }
  function fail(msg) { err = true; cur = msg || 'Cannot divide by zero'; hist = ''; show(); }
  function compute(a, o, b) {
    if (o === '+') return a + b;
    if (o === '-') return a - b;
    if (o === '*') return a * b;
    if (b === 0) return null;
    return a / b;
  }
  function input(k) {
    if (err) { clearAll(); if (k === 'C' || k === 'CE' || k === 'back') { show(); return; } }
    if (/^[0-9]$/.test(k)) {
      if (fresh) { cur = k; fresh = false; } else if (cur.replace(/[-.]/g, '').length < 15) cur = cur === '0' ? k : cur + k;
    } else if (k === '.') {
      if (fresh) { cur = '0.'; fresh = false; } else if (cur.indexOf('.') < 0) cur += '.';
    } else if (k === '+' || k === '-' || k === '*' || k === '/') {
      const v = parseFloat(cur);
      if (op !== null && !fresh) {
        const r = compute(acc, op, v);
        if (r === null) { fail(); return; }
        acc = r; cur = fmtN(r);
      } else if (op === null) acc = v;
      op = k; fresh = true; lastOp = null; hist = fmtN(acc) + ' ' + SYM[op];
    } else if (k === '=') {
      let a, o, b;
      if (op !== null) { a = acc; o = op; b = parseFloat(cur); }
      else if (lastOp) { a = parseFloat(cur); o = lastOp; b = lastVal; }
      else return;
      const r = compute(a, o, b);
      if (r === null) { fail(); return; }
      hist = fmtN(a) + ' ' + SYM[o] + ' ' + fmtN(b) + ' =';
      lastOp = o; lastVal = b; op = null; acc = null; cur = fmtN(r); fresh = true;
    } else if (k === 'C') clearAll();
    else if (k === 'CE') { cur = '0'; fresh = true; }
    else if (k === 'back') {
      if (!fresh) cur = (cur.length > 1 && !(cur.length === 2 && cur[0] === '-')) ? cur.slice(0, -1) : '0';
    } else if (k === 'neg') {
      if (cur !== '0') cur = cur[0] === '-' ? cur.slice(1) : '-' + cur;
    } else if (k === 'sqrt') {
      const v = parseFloat(cur);
      if (v < 0) { fail('Invalid input'); return; }
      hist = '\u221a(' + fmtN(v) + ')'; cur = fmtN(Math.sqrt(v)); fresh = true;
    } else if (k === 'sq') {
      const v = parseFloat(cur); hist = 'sqr(' + fmtN(v) + ')'; cur = fmtN(v * v); fresh = true;
    } else if (k === 'inv') {
      const v = parseFloat(cur);
      if (v === 0) { fail(); return; }
      hist = '1/(' + fmtN(v) + ')'; cur = fmtN(1 / v); fresh = true;
    } else if (k === 'pct') {
      const v = parseFloat(cur);
      cur = op !== null ? fmtN(acc * v / 100) : '0'; fresh = true;
    }
    show();
  }
  const rows = [
    [['pct', '%'], ['sqrt', '\u221a'], ['sq', 'x\u00b2'], ['inv', '1/x']],
    [['CE', 'CE'], ['C', 'C'], ['back', 'DEL'], ['/', '\u00f7', 'op']],
    [['7', '7'], ['8', '8'], ['9', '9'], ['*', '\u00d7', 'op']],
    [['4', '4'], ['5', '5'], ['6', '6'], ['-', '\u2212', 'op']],
    [['1', '1'], ['2', '2'], ['3', '3'], ['+', '+', 'op']],
    [['neg', '\u00b1'], ['0', '0'], ['.', '.'], ['=', '=', 'eq']]
  ];
  const keys = h('div', { class: 'keys' });
  rows.forEach((row) => row.forEach(([k, label, cls]) => {
    keys.append(h('button', { class: 'btn key' + (cls ? ' ' + cls : ''), type: 'button', 'aria-label': label,
      onpointerdown: (e) => e.preventDefault(), onclick: () => input(k) }, label));
  }));
  win.body.append(h('div', { class: 'calc' }, h('div', { class: 'scr', 'aria-live': 'polite' }, histEl, num), keys));
  win.onKey = (e) => {
    const k = e.key;
    if (/^[0-9]$/.test(k)) input(k);
    else if (k === '.' || k === ',') input('.');
    else if (k === '+' || k === '-' || k === '*' || k === '/') input(k);
    else if (k === 'Enter' || k === '=') input('=');
    else if (k === 'Backspace') input('back');
    else if (k === 'Escape') input('C');
    else if (k === 'Delete') input('CE');
    else if (k === '%') input('pct');
    else return;
    e.preventDefault();
  };
  show();
}

/* ---------- app: Paint ---------- */
function mountPaint(win, args) {
  const W = 320, H = 240;
  let tool = 'pencil', color = '#000000', size = 3;
  let fileId = args.fileId && fs.nodes[args.fileId] ? args.fileId : null;
  const undo = [];
  const canvas = h('canvas', { class: 'pcanvas', width: W, height: H, 'aria-label': 'Drawing canvas' });
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  if (fileId && fs.nodes[fileId].content) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, W, H);
    img.src = fs.nodes[fileId].content;
  }
  const strip = h('div', { class: 'strip', hidden: true });
  const stL = h('span', null, 'Pencil, size 3'), stR = h('span');
  const status = () => { stL.textContent = { pencil: 'Pencil', eraser: 'Eraser', line: 'Line', rect: 'Box', fill: 'Fill' }[tool] + (tool === 'fill' ? '' : ', size ' + size); };
  const title = () => win.setTitle((fileId && fs.nodes[fileId] ? fs.nodes[fileId].name : 'Untitled') + ' - Paint');

  const toolBtns = {};
  const toolRow = h('div', { class: 'toolbar' });
  [['pencil', 'Pencil'], ['eraser', 'Eraser'], ['line', 'Line'], ['rect', 'Box'], ['fill', 'Fill']].forEach(([k, label]) => {
    const b = h('button', { class: 'btn', type: 'button', 'aria-pressed': k === tool ? 'true' : 'false', onclick: () => {
      tool = k; Object.keys(toolBtns).forEach((x) => toolBtns[x].setAttribute('aria-pressed', x === k ? 'true' : 'false')); status();
    } }, label);
    toolBtns[k] = b; toolRow.append(b);
  });
  const sizeBtns = {};
  const optRow = h('div', { class: 'toolbar' });
  [1, 3, 6].forEach((s) => {
    const b = h('button', { class: 'btn', type: 'button', 'aria-label': 'Size ' + s, 'aria-pressed': s === size ? 'true' : 'false', onclick: () => {
      size = s; Object.keys(sizeBtns).forEach((x) => sizeBtns[x].setAttribute('aria-pressed', Number(x) === s ? 'true' : 'false')); status();
    } }, String(s));
    sizeBtns[s] = b; optRow.append(b);
  });
  function pushUndo() { undo.push(ctx.getImageData(0, 0, W, H)); if (undo.length > 15) undo.shift(); }
  optRow.append(
    h('button', { class: 'btn', type: 'button', onclick: () => { const s = undo.pop(); if (s) ctx.putImageData(s, 0, 0); } }, 'Undo'),
    h('button', { class: 'btn', type: 'button', onclick: () => { pushUndo(); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); } }, 'Clear'),
    h('button', { class: 'btn', type: 'button', onclick: save }, 'Save'));

  function pos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }
  function stroke() {
    ctx.lineWidth = tool === 'eraser' ? size * 4 : size;
    ctx.strokeStyle = tool === 'eraser' ? '#ffffff' : color;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  }
  function seg(a, b) { stroke(); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x + 0.01, b.y); ctx.stroke(); }
  function shape(a, b) {
    stroke();
    if (tool === 'line') { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    else ctx.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y);
  }
  function flood(px, py, hex) {
    const img = ctx.getImageData(0, 0, W, H), d = img.data;
    const x0 = clamp(Math.floor(px), 0, W - 1), y0 = clamp(Math.floor(py), 0, H - 1);
    const i0 = (y0 * W + x0) * 4, tr = d[i0], tg = d[i0 + 1], tb = d[i0 + 2];
    const fr = parseInt(hex.slice(1, 3), 16), fg = parseInt(hex.slice(3, 5), 16), fb = parseInt(hex.slice(5, 7), 16);
    const seen = new Uint8Array(W * H), stack = [y0 * W + x0];

      const p = stack.pop();
      if (seen[p]) continue;
      seen[p] = 1;
      const i = p * 4;
      if (Math.abs(d[i] - tr) + Math.abs(d[i + 1] - tg) + Math.abs(d[i + 2] - tb) > 60) continue;
      d[i] = fr; d[i + 1] = fg; d[i + 2] = fb; d[i + 3] = 255;
      const x = p % W, y = (p / W) | 0;

      if (x < W - 1) stack.push(p + 1);
      if (y > 0) stack.push(p - W);

    if (!drawing) return;

  });
  const end = () => { drawing = false; snap = null; };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);

  function save() {
    if (fileId && fs.nodes[fileId]) {
      fs.nodes[fileId].content = canvas.toDataURL('image/png');
      stR.textContent = fsChanged() ? 'Saved' : 'Storage full: could not save';
      return;
    }
    const nameIn = h('input', { class: 'inp', id: 'pt-name-' + win.id, type: 'text', value: 'drawing.png', maxlength: '60', 'aria-label': 'File name' });
    const folderSel = h('select', { class: 'inp', id: 'pt-folder-' + win.id, 'aria-label': 'Folder' },
      allFolders().map((f) => h('option', { value: f.id }, pathOf(f.id))));
    folderSel.value = fs.nodes.pics && live('pics') ? 'pics' : 'root';
    const doSave = () => {
      let nm = cleanName(nameIn.value) || 'drawing.png';
      if (!/\.png$/i.test(nm)) nm += '.png';
      const parent = folderSel.value;
      const n = { id: newId(), name: uniqueName(parent, nm), type: 'image', parent: parent, content: canvas.toDataURL('image/png') };
      fs.nodes[n.id] = n; fileId = n.id;
      const ok = fsChanged(); strip.hidden = true; strip.replaceChildren(); title();
      stR.textContent = ok ? 'Saved' : 'Storage full: could not save';
    };
    nameIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSave(); });
    strip.hidden = false;
    strip.replaceChildren(h('span', null, 'Save as:'), nameIn, folderSel,
      h('button', { class: 'btn sm', type: 'button', onclick: doSave }, 'Save'),
      h('button', { class: 'btn sm', type: 'button', onclick: () => { strip.hidden = true; strip.replaceChildren(); } }, 'Cancel'));
    nameIn.focus(); nameIn.select();
  }

  const COLORS = ['#000000', '#808080', '#800000', '#808000', '#008000', '#008080', '#000080', '#800080',
    '#ffffff', '#c0c0c0', '#ff0000', '#ffff00', '#00ff00', '#00ffff', '#0000ff', '#ff00ff'];
  const pal = h('div', { class: 'pal', role: 'group', 'aria-label': 'Colors' });
  const sws = [];
  COLORS.forEach((c) => {
    const b = h('button', { class: 'sw', type: 'button', 'aria-label': 'Color ' + c, 'aria-pressed': c === color ? 'true' : 'false', style: 'background:' + c, onclick: () => {
      color = c; sws.forEach((x) => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    } });
    sws.push(b); pal.append(b);
  });
  win.body.append(toolRow, optRow, strip, h('div', { class: 'pstage' }, canvas), pal, h('div', { class: 'statusbar' }, stL, stR));
  title(); status();
}

/* ---------- app: Minesweeper ---------- */
function mountMines(win) {
  const R = 9, C = 9, M = 10, N = R * C;
  let mine, adj, st, over, won, started, left, secs, tmr, boom, flagMode = false, suppress = false, lastType = 'mouse';
  const lcdL = h('div', { class: 'lcd', 'aria-label': 'Mines left' }), lcdR = h('div', { class: 'lcd', 'aria-label': 'Seconds' });
  const face = h('button', { class: 'btn face', type: 'button', 'aria-label': 'New game', onclick: reset });
  const grid = h('div', { class: 'mgrid' });
  const cells = [];
  const fmt = (n) => n < 0 ? '-' + String(Math.min(99, -n)).padStart(2, '0') : String(Math.min(999, n)).padStart(3, '0');
  function nbrs(i) {
    const r = (i / C) | 0, c = i % C, out = [];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const rr = r + dr, cc = c + dc;
      if (rr >= 0 && rr < R && cc >= 0 && cc < C) out.push(rr * C + cc);
    }
    return out;
  }
  function paint() {
    cells.forEach((b, i) => {
      let cls = 'cell', html = '', label = 'Hidden cell';
      if (st[i] === 1) { cls += ' open'; label = 'Open'; if (adj[i] > 0) { cls += ' n' + adj[i]; html = String(adj[i]); label = adj[i] + ' nearby'; } }
      else if (st[i] === 2) { html = FLAG; label = 'Flag'; }
      if (over) {
        if (mine[i] && st[i] !== 2) { cls += ' open'; html = MINE; label = 'Mine'; if (i === boom) cls += ' boom'; }
        else if (!mine[i] && st[i] === 2) { cls += ' open'; html = WRONG; label = 'Wrong flag'; }
      }
      b.className = cls; b.innerHTML = html; b.setAttribute('aria-label', label);
    });
    lcdL.textContent = fmt(left); lcdR.textContent = fmt(secs);
    face.textContent = over ? (won ? 'B)' : 'X(') : ':)';
  }
  function reset() {
    clearInterval(tmr);
    mine = new Array(N).fill(false); adj = new Array(N).fill(0); st = new Array(N).fill(0);
    over = won = started = false; left = M; secs = 0; boom = -1;
    paint();
  }
  function place(safe) {
    const block = new Set([safe].concat(nbrs(safe)));
    let n = 0;
    while (n < M) { const i = Math.floor(Math.random() * N); if (!mine[i] && !block.has(i)) { mine[i] = true; n++; } }
    for (let i = 0; i < N; i++) adj[i] = nbrs(i).filter((j) => mine[j]).length;
  }
  function lose(i) { over = true; boom = i; clearInterval(tmr); }
  function checkWin() {
    if (st.filter((s) => s === 1).length === N - M) {
      over = won = true; clearInterval(tmr);
      for (let i = 0; i < N; i++) if (mine[i]) st[i] = 2;
      left = 0;
    }
  }
  function reveal(i) {
    if (st[i] !== 0) return;
    if (!started) {
      started = true; place(i);
      tmr = setInterval(() => { secs = Math.min(999, secs + 1); lcdR.textContent = fmt(secs); }, 1000);
    }
    if (mine[i]) { lose(i); return; }
    const stack = [i];
    while (stack.length) {
      const p = stack.pop();
      if (st[p] !== 0) continue;
      st[p] = 1;
      if (adj[p] === 0) nbrs(p).forEach((q) => { if (st[q] === 0) stack.push(q); });
    }
    checkWin();
  }
  function flag(i) {
    if (st[i] === 1) return;
    if (st[i] === 0) { st[i] = 2; left--; } else { st[i] = 0; left++; }
  }
  function chord(i) {
    if (adj[i] === 0) return;
    const ns = nbrs(i);
    if (ns.filter((q) => st[q] === 2).length !== adj[i]) return;
    ns.forEach((q) => { if (!over && st[q] === 0) reveal(q); });
  }
  for (let i = 0; i < N; i++) {
    let hold = null;
    const b = h('button', { class: 'cell', type: 'button', 'aria-label': 'Hidden cell' });
    b.addEventListener('pointerdown', (e) => {
      lastType = e.pointerType;
      if (e.pointerType !== 'mouse') hold = setTimeout(() => { if (!over) { suppress = true; flag(i); paint(); } }, 420);
    });
    const stop = () => { clearTimeout(hold); setTimeout(() => { suppress = false; }, 60); };
    b.addEventListener('pointerup', stop); b.addEventListener('pointerleave', () => clearTimeout(hold)); b.addEventListener('pointercancel', stop);
    b.addEventListener('click', () => {
      if (over || suppress) return;
      if (flagMode) flag(i); else if (st[i] === 1) chord(i); else if (st[i] === 0) reveal(i);
      paint();
    });
    b.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (lastType === 'mouse' && !over) { flag(i); paint(); }
    });
    cells.push(b); grid.append(b);
  }
  const flagB = h('button', { class: 'btn', type: 'button', 'aria-pressed': 'false', onclick: () => {
    flagMode = !flagMode; flagB.setAttribute('aria-pressed', flagMode ? 'true' : 'false');
  } }, 'Flag mode');
  win.body.append(h('div', { class: 'mines' },
    h('div', { class: 'mhead' }, lcdL, face, lcdR), grid,
    h('div', { class: 'mfoot' }, flagB, h('span', null, 'Or long-press / right-click a square to flag it.'))));
  win.onClose = () => clearInterval(tmr);
  reset();
}

/* ---------- app: Tanks! (the supplied game, wrapped in a window) ---------- */
function mountTanks(win) {
  const cv = h('canvas', { class: 'tcanvas', width: 800, height: 600, 'aria-label': 'Tanks game' });
  const ctx = cv.getContext('2d');
  const W = 800, H = 560, OY = 40, T = 40, C = 20, RW = 14, R = 14;

    { sp: 1.2, bs: 4, bn: 2, cd: 45, mb: 3, ml: 0 },
    { sp: 1.4, bs: 5, bn: 2, cd: 30, mb: 4, ml: 0 }];

    { k: 'bounce', n: 'Extra bounce', d: 'Your shells bounce one more time', max: 3, base: 30 },

    { k: 'ammo', n: 'Extra ammo', d: '+1 shell on screen at once', max: 3, base: 30 },
    { k: 'bspeed', n: 'Fast shells', d: 'Shells fly 25% faster', max: 2, base: 25 },
    { k: 'speed', n: 'Engine', d: 'Tank moves 10% faster', max: 3, base: 25 }];
  function lvl(it) { return it.k === 'shield' ? shield : it.k === 'life' ? lives : ups[it.k]; }

      }
    }
  }
  function startMission() { coinsStart = coins; build(); state = 'intro'; timer = 150; }
  function boom(x, y, s) { fx.push({ x: x, y: y, r: 4, max: s }); }

    if (t.dead) return; t.dead = true; boom(t.x, t.y, 40); wrecks.push({ x: t.x, y: t.y });

  }
  function shoot(o, sp, bn, mb) {

  }
  function ai(e) {

    if (ty.ml && --e.mc <= 0) { e.mc = 300 + Math.random() * 300 | 0; if (mines.filter((m) => m.o === e).length < 2) mines.push({ x: e.x, y: e.y, t: 540, o: e }); }
  }
  function upd() {
    const p = player;
    if (p.inv > 0) p.inv--;

      if (dx || dy) { const l = Math.hypot(dx, dy), s = 2.2 * (1 + .1 * ups.speed); mv(p, dx / l * s, dy / l * s); p.ba = Math.atan2(dy, dx); }
      p.t = Math.atan2(my - p.y, mx - p.x);

      for (const c of coinsArr) if (Math.hypot(c.x - p.x, c.y - p.y) < R + 8) { coins += c.v; c.got = 1; }

  /* drawing: black lines on white */

      onpointerdown: (e) => { e.preventDefault(); keys[key] = 1; },
      onpointerup: () => { keys[key] = 0; }, onpointerleave: () => { keys[key] = 0; }, onpointercancel: () => { keys[key] = 0; } }, label);

      h('div', { class: 'dp' }, hold('←', 'arrowleft'), hold('↑', 'arrowup'), hold('↓', 'arrowdown'), hold('→', 'arrowright')),
      h('button', { class: 'btn', type: 'button', onpointerdown: (e) => { e.preventDefault(); layMine(); } }, 'Mine')));
  }
  parts.push(h('div', { class: 'thint' }, touch
    ? 'Drag to aim, tap to fire. Use the arrows to drive and Mine to drop a mine. In the shop, tap a row to buy.'
    : 'WASD / arrows: move · Mouse: aim · Click: fire · Space or right-click: mine · Shop: click a row or press 1–7'));

    window.removeEventListener('blur', clearKeys);
  };

}

})();
</script>
